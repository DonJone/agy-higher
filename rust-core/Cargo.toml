[package]
name = "agy-higher-core"
version = "0.1.0"
edition = "2021"
description = "Core Rust library for agy-higher macOS session workbench"

[lib]
name = "agy_higher_core"
crate-type = ["rlib", "staticlib"]

[dependencies]
rusqlite = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
